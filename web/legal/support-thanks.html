<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MING · Support Request Received</title>
    <style>
      :root { color-scheme:dark; --bg:#080c0d; --panel:#121718; --text:#ecf5f2; --muted:#9cafad; --gold:#d8b65f; --line:rgba(255,255,255,.12); }
      body { margin:0; background:radial-gradient(circle at 25% 0%, rgba(40,245,190,.12), transparent 34%), var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height:1.7; }
      main { max-width:720px; margin:0 auto; padding:64px 20px; }
      .card { border:1px solid var(--line); border-radius:10px; background:rgba(18,23,24,.84); padding:22px; }
      h1 { margin:0 0 10px; font-size:34px; line-height:1.1; }
      p { color:var(--muted); }
      a { color:var(--gold); }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Request received</h1>
        <p>Thank you. Your MING support request has been submitted.</p>
        <p><a href="/support">Return to Support</a></p>
      </section>
    </main>
  </body>
</html>
