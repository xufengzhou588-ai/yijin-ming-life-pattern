name: App Store Connect Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Inspect metadata or attach build 2 to iOS 1.0"
        required: true
        default: status
        type: choice
        options:
          - status
          - preflight
          - attach

jobs:
  release:
    name: ${{ inputs.action == 'attach' && 'Attach build 2' || inputs.action == 'preflight' && 'Preflight iOS 1.0' || 'Check build 2' }}
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure API client
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/python" -m pip install --quiet \
            "PyJWT[crypto]>=2.10,<3"

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Check App Store release
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/asc-venv/bin/python" tools/app_store_connect_release.py \
            --action "${{ inputs.action }}" \
            --bundle-id app.mingpattern.life \
            --version 1.0 \
            --build 2
