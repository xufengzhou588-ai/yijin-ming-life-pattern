name: iOS App Store

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: "Upload the exported IPA to App Store Connect"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  archive:
    name: Archive with Xcode 26
    runs-on: macos-26
    timeout-minutes: 60

    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_TEAM_ID: WQ8RHQUVQQ
      APP_STORE_BUNDLE_ID: app.mingpattern.life

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version -sdk iphoneos

      - name: Set up Python
        run: |
          python3 -m venv "$RUNNER_TEMP/yijin-venv"
          "$RUNNER_TEMP/yijin-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/yijin-venv/bin/python" -m pip install -r requirements.txt pytest

      - name: Validate release
        run: |
          set -euo pipefail
          PYTHON="$RUNNER_TEMP/yijin-venv/bin/python"
          PYTHONPATH="$GITHUB_WORKSPACE" "$PYTHON" -m pytest -q
          "$PYTHON" -m py_compile server.py tests/test_nav_paywall_a11y.py
          node --check web/js/app-v20260826.js
          node --check web/js/locales-v20260826.js
          node --check web/js/analytics-v20260826.js
          plutil -lint ios/MINGLifePattern/Resources/Info.plist
          git diff --check

      - name: Verify free-first production config
        run: |
          set -euo pipefail
          PYTHON="$RUNNER_TEMP/yijin-venv/bin/python"
          MING_PRO_MODE=free_first \
          APP_STORE_ENVIRONMENT=production \
          BAZI_SESSION_SECRET=free-first-release-session-secret-2026 \
          BAZI_COOKIE_SECURE=1 \
          BAZI_DEMO_UNLOCK= \
          BAZI_STOREKIT_STUB= \
          BAZI_ALLOW_INSECURE_STOREKIT_STUB= \
          "$PYTHON" tools/verify_production_config.py

      - name: Configure App Store Connect API key
        run: |
          set -euo pipefail
          missing=()
          [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] || missing+=("APP_STORE_CONNECT_API_KEY_ID")
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] || missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] || missing+=("APP_STORE_CONNECT_API_KEY_BASE64")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing App Store Connect API key secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/private_keys" "$HOME/.appstoreconnect/private_keys"
          if ! echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"; then
            echo "APP_STORE_CONNECT_API_KEY_BASE64 is not valid base64. Recreate it with: base64 -i AuthKey_<KEY_ID>.p8 | pbcopy" >&2
            exit 1
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"; then
            echo "APP_STORE_CONNECT_API_KEY_BASE64 decoded, but it does not look like an App Store Connect .p8 private key." >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Archive iOS app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project MINGLifePattern.xcodeproj \
            -scheme MINGLifePattern \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MINGLifePattern.xcarchive" \
            DEVELOPMENT_TEAM="$APP_STORE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_STORE_BUNDLE_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Upload archive log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MINGLifePattern-Xcodebuild-Archive-Log
          path: ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: ignore

      - name: Upload XCArchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINGLifePattern-XCArchive
          path: ${{ runner.temp }}/MINGLifePattern.xcarchive
          if-no-files-found: error

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MINGLifePattern.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/AppStoreConnect/exportOptions-app-store-connect.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINGLifePattern-AppStore-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.upload_to_app_store == 'true' }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name "*.ipa" -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found to upload." >&2
            exit 1
          fi

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
